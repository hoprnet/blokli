# Terminate any test that runs longer than 3×60s = 180s. This turns a single
# hung/slow test into a fast, attributable failure instead of a silent 30-min
# CI job timeout.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Every integration test (anything under a crate's `tests/` directory) spins up
# its own Anvil node and, in some cases, a full GraphQL stack — each is heavy on
# CPU, memory, and ephemeral ports. Cap how many run at once so a large CI runner
# doesn't try to launch a dozen Anvils simultaneously and thrash. Unit tests
# (kind = lib/bin) are unaffected and keep running at full parallelism.
[test-groups.integration]
max-threads = 4

[[profile.default.overrides]]
filter     = "kind(=test)"
test-group = "integration"
