"""
Transaction submission result
"""
type Transaction {
	"""
	Unique identifier for the transaction (UUID)
	"""
	id: ID!
	"""
	Current status of the transaction
	"""
	status: TransactionStatus!
	"""
	Timestamp when transaction was submitted
	"""
	submittedAt: DateTime!
