# curvy-bindings — Rust bindings for the Curvy v2 contract suite, a structural mirror
# of hoprnet's `hopr-bindings` crate (committed `forge bind --alloy` codegen, a
# `config.rs` with typed addresses/instances + `deploy_for_testing`, a `constants.rs`
# with the dev/protocol constants).
#
# VERSIONING POLICY (lockstep, like hopr-bindings ↔ hoprnet/contracts): this crate's
# version tracks the contracts package version (`packages/contracts/evm/package.json`,
# currently 1.0.0). Bump them together on every contract release; regenerate the
# committed codegen with `../generate.sh` (which also runs the bytecode parity gate).
#
# ALLOY: pinned `=2.1.0` exactly like the published hopr-bindings 4.9.1, so the crate
# drops into blokli's alloy-2.1 world with an identical resolution. (The `>=1,<3`
# range trick used by the interim `curvy-deployer` crate is NOT appropriate here: this
# crate's committed codegen uses `alloy::contract` instance types, whose API shape is
# alloy-2.x-specific — a floating range would advertise compatibility the generated
# code cannot honour.)

[package]
name = "curvy-bindings"
version = "1.0.0"
description = "This package only exists to automate the export and generation of Rust bindings into the Curvy project"
edition = "2024"
authors = ["Curvy"]
license = "MIT"
publish = false # hosting postponed by owner decision — path dependency for now

# Detached crate: the surrounding monorepo is a JS workspace; never let a future
# parent Cargo workspace capture this crate.

[dependencies]
alloy = { version = "=2.1.0", default-features = false, features = [
    "essentials",
    "json-rpc",
    "node-bindings",
    "contract",
    "k256",
    "std",
] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
