---
name: Zizmor
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/**"
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-zizmor
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  zizmor:
    uses: hoprnet/hopr-workflows/.github/workflows/checks-zizmor.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-checks-zizmor-v2.0.0
    permissions:
      contents: read
      security-events: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      cachix_cache_name: blokli
      runner: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
