---
name: Merge queue
# The merge queue's mandatory gate. Integration throughput is a required status
# check, so a red result here ejects the queued change and sends the PR back;
# everything else in the queue is a heavy pr.yaml job that skips (see pr.yaml).
#
# Triggers on BOTH events on purpose:
#   * merge_group — the job runs for real and gates the merge.
#   * pull_request — the job SKIPS (see the `if` below). A required check must
#     report on every PR or the PR is blocked on a status that never arrives; a
#     skipped job still reports (skipped = passing), so the requirement is
#     satisfied on the PR without the job running there.
#
# Placeholder for now: a no-op that always passes. It will become a dispatch to
# hoprnet/hopr-integration-tests (`integration.yaml`) once the cross-repo trigger
# is wired up.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.head.ref || github.ref_name }}-merge-queue
  cancel-in-progress: true
jobs:
  integration-throughput:
    name: Integration throughput # must match the required-check context exactly
    # Runs only in the merge queue; skips on pull_request (reports skipped = passing).
    if: github.event_name == 'merge_group'
    runs-on: depot-ubuntu-24.04-2
    steps:
      - name: Placeholder
        run: echo "Integration throughput placeholder — always passes for now."
