---
name: Merge
#
# TODO(curvy-integration): revert the Curvy integration-branch scaffolding once
# `curvy-integration` has been merged into `main`. See hoprnet/blokli#432.
#
#   1. Drop `curvy-integration` from `on.pull_request.branches` below.
#   2. Drop the `base.ref == 'main'` guard from `build-docker` and
#      `build-docker-with-anvil` — it only exists because the reusable workflow
#      republishes the floating `latest` tags on any base branch, which would let a
#      `curvy-integration` merge overwrite `bloklid:latest`. With only `main` left,
#      the guard is dead weight.
#
# Keep the `deploy-dev` guard and the `notify` result matching: both are correct
# independently of the integration branch.
#
on:
  pull_request:
    types:
      - closed
      # - synchronize
    branches:
      - main
      # TODO(curvy-integration): remove once merged into main — see header.
      - curvy-integration
concurrency:
  group: merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  build-binaries:
    name: Binary ${{ matrix.architecture }}
    if: github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-4
            build_command: nix build -L .#binary-bloklid-x86_64-linux
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-4
            build_command: nix build -L .#binary-bloklid-aarch64-linux
          - architecture: aarch64-darwin
            runner: depot-macos-15
            build_command: nix build -L .#binary-bloklid-aarch64-darwin
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@45221eb1aadfc5c46751306c5c7d6d291c8a24b3 # build-binaries-v3.1.2
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.base.ref }}
      version_type: pr
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: blokli
      build_file: bloklid/Cargo.toml
      build_command: ${{ matrix.build_command }}
      binary: bloklid
      runner: ${{ matrix.runner }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GPG_HOPRNET_PRIVATE_KEY }}
  # The reusable workflow republishes the floating `latest` / `latest-<platform>` tags
  # on every `pr` build regardless of base branch, so the Curvy-less images are built
  # from main only — otherwise a curvy-integration merge would overwrite `bloklid:latest`.
  # TODO(curvy-integration): drop the base.ref guard once merged into main — see header.
  build-docker:
    name: Docker
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@25898d13dab1b3fbf4c33c394e7c581578a2b0d7 # build-docker-v3.2.0
    needs: build-binaries
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.base.ref }}
      version_type: pr
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-bloklid-x86_64-linux"
          },
          {
            "runner": "depot-ubuntu-24.04-arm-4",
            "architecture": "aarch64-linux",
            "build_command": "nix build -L .#docker-bloklid-aarch64-linux"
          }
        ]
      cachix_cache_name: blokli
      build_file: bloklid/Cargo.toml
      docker_image_name: bloklid
      docker_image_format: skopeo
      concurrency_group_suffix: main
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Curvy-less anvil image: main only, same floating-tag reason as build-docker.
  # TODO(curvy-integration): drop the base.ref guard once merged into main — see header.
  build-docker-with-anvil:
    name: Docker anvil
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@25898d13dab1b3fbf4c33c394e7c581578a2b0d7 # build-docker-v3.2.0
    needs: build-binaries
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.base.ref }}
      version_type: pr
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-bloklid-anvil-x86_64-linux"
          }
        ]
      cachix_cache_name: blokli
      build_file: bloklid/Cargo.toml
      docker_image_name: bloklid-anvil
      docker_image_format: skopeo
      concurrency_group_suffix: anvil
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Same local Anvil image as above, but with the Curvy v2 contract suite deployed
  # alongside the HOPR contracts. Published under a separate image name so the stock
  # bloklid-anvil tags stay Curvy-free.
  build-docker-with-anvil-curvy:
    name: Docker anvil curvy
    if: github.event.pull_request.merged == true
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@25898d13dab1b3fbf4c33c394e7c581578a2b0d7 # build-docker-v3.2.0
    needs: build-binaries
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.base.ref }}
      version_type: pr
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-bloklid-anvil-curvy-x86_64-linux"
          }
        ]
      cachix_cache_name: blokli
      build_file: bloklid/Cargo.toml
      docker_image_name: bloklid-anvil-curvy
      docker_image_format: skopeo
      concurrency_group_suffix: anvil-curvy
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  deploy-dev:
    name: Deploy Gnosis Dev
    # Only main reaches the shared Gnosis Dev environment; integration branches
    # publish images but must not trigger a deployment.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: depot-ubuntu-24.04-2
    needs: build-docker
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_GNOSISVPN_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_GNOSISVPN_BOT_PRIVATE_KEY }}
          owner: gnosis
          repositories: gnosis_vpn-infrastructure
          permission-contents: write
      - name: Deploy to Gnosis Dev
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.bot-token.outputs.token }}
          repository: gnosis/gnosis_vpn-infrastructure
          event-type: deploy_blokli
          client-payload: |-
            {
              "deployment_environment": "development",
              "tag": "${{ needs.build-docker.outputs.docker_build_version }}"
            }
  notify:
    name: Notify failure
    needs:
      - build-binaries
      - build-docker
      - build-docker-with-anvil
      - build-docker-with-anvil-curvy
      - deploy-dev
    # Match on explicit failure/cancellation rather than !success(): jobs gated to main
    # are *skipped* on other base branches, and a skipped need also makes success() false.
    if: >-
      ${{ always() && github.event.pull_request.merged == true
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: depot-ubuntu-24.04-2
    steps:
      - name: Notify failed merge pipeline
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa # v2.0.1
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ secrets.ZULIP_EMAIL }}
          organization-url: "https://hopr.zulipchat.com"
          type: "stream"
          to: "Blokli"
          topic: "main"
          content: |
            The merge pipeline has failed for pull request [#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
