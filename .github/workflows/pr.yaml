---
################################################################################
# Pull request pipeline for blokli
#
# Validates PR metadata, runs code-quality checks and tests via shared
# workflows, then builds binaries, Docker images, and runs integration tests.
################################################################################
name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  # ── PR metadata ──────────────────────────────────────────────────────────────
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04-2
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Fork PRs get a read-only token and cannot write labels; stay green so the gate passes.
    continue-on-error: true
    runs-on: depot-ubuntu-24.04-2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@77a4082b841706ac431479b7e2bb11216ffef250 # main on 20.02.2025
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  # ── Path filter ─────────────────────────────────────────────────────────────
  # Gate jobs through inputs on the reusable workflows, not with a caller-level
  # `if:`: an input-skipped inner job still reports its required check name as
  # skipped (green), a skipped caller job does not. Outside pull_request (merge
  # queue) every output is true, so the queue never filters anything out.
  changes:
    name: Detect changes
    runs-on: depot-ubuntu-24.04-2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "api/**"
              - "bloklid/**"
              - "chain/**"
              - "db/**"
              - "helper/**"
              - "types/**"
              - "tests/**"
              - "scripts/**"
              - "docker/**"
              - "justfile"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - ".cargo/**"
              - ".config/**"
              - ".graphql*"
              - "flake.nix"
              - "flake.lock"
              - "nix/**"
              - ".github/workflows/**"
            lockfile:
              - "**/Cargo.toml"
              - "Cargo.lock"
              - ".cargo/audit.toml"
              - "flake.nix"
              - "flake.lock"
  # ── Stage 1: shared checks (format, pre-commit, lint, audit) ────────────────
  checks:
    name: Check
    needs: changes
    # In the merge queue we don't re-run the heavy checks, but their contexts
    # (`Check / *`) are required and must report on the merge group or the queue
    # stalls. So the job runs on merge_group too, with the reusable workflow's
    # enable booleans turned off there: the work is skipped while each `Check / *`
    # still reports (green). Only Integration throughput does real work in the
    # queue (see merge-queue.yaml). `!= 'merge_group'` keeps PR behaviour intact.
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-checks-v3.0.0
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      cachix_cache_name: blokli
      format: ${{ github.event_name != 'merge_group' }}
      pre_commit: ${{ github.event_name != 'merge_group' }}
      lint: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      audit: ${{ github.event_name != 'merge_group' && needs.changes.outputs.lockfile == 'true' }}
      lint_command: "nix build -L .#bloklid-clippy"
      audit_command: "nix run -L .#audit"
      deps: ${{ github.event_name != 'merge_group' }}
      runner_small: depot-ubuntu-24.04-2
      runner_large: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # ── Stage 2: tests ──────────────────────────────────────────────────────────
  # Stages: changes + checks, then tests and schema jobs, then builds. A later
  # stage runs when every earlier job succeeded or was skipped. The `!cancelled()
  # && !failure()` condition tolerates a skipped upstream (input-skipped caller,
  # draft PR, fork) while a real failure still stops the later stages.
  tests:
    name: Test
    needs: [changes, checks]
    if: ${{ !cancelled() && !failure() }}
    # Runs on merge_group too, but coverage is disabled there so `Test / Coverage /
    # Unit` reports (skipped) without re-running (see `checks`). The other Test
    # contexts are already skipped on every event.
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-tests-v7.0.0
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload in the coverage job
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      cachix_cache_name: blokli
      enable_unit_tests: false
      enable_unit_coverage: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      unit_coverage_command: "nix build -L .#bloklid-coverage -o coverage.lcov"
      runner_unit: depot-ubuntu-24.04-4
      test_timeout: 30
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # ── Repo-specific: schema validation ────────────────────────────────────────
  schema-validation:
    name: Schema Validation
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    needs: [changes, checks]
    if: ${{ !cancelled() && !failure() && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # setup-nix-v2.0.2
        with:
          cachix_cache_name: blokli
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate GraphQL schema
        run: nix build -L .#schema-validation
  # ── Repo-specific: entity / PostgreSQL schema drift ─────────────────────────
  postgres-schema:
    name: Postgres Schema
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    needs: [changes, checks]
    if: ${{ !cancelled() && !failure() && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # setup-nix-v2.0.2
        with:
          cachix_cache_name: blokli
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check entities against the PostgreSQL schema
        run: nix develop -c just test-postgres-schema
  # ── Stage 3: builds (binaries, Docker) ──────────────────────────────────────
  build-binaries:
    name: Binary ${{ matrix.architecture }}
    needs: [changes, checks, tests, schema-validation, postgres-schema]
    if: ${{ !cancelled() && !failure() }}
    # Runs on merge_group too; `enabled` is off there so the `Binary … / Build`
    # and `… / Sign and Publish` contexts report (skipped) without rebuilding
    # (see `checks`). The reusable job carries the matrix so names stay expanded.
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-4
            build_command: nix build -L .#binary-bloklid-x86_64-linux
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-4
            build_command: nix build -L .#binary-bloklid-aarch64-linux
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: depot-macos-15
            build_command: nix build -L .#binary-bloklid-aarch64-darwin
            required_label: "binary:aarch64-darwin"
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@3df1022f4b852f1b7acd064123ce819258a62fe3 # build-binaries-v4.0.1
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      cachix_cache_name: blokli
      build_file: bloklid/Cargo.toml
      build_command: ${{ matrix.build_command }}
      binary: bloklid
      runner: ${{ matrix.runner }}
      enabled: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' && (matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label)) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GPG_HOPRNET_PRIVATE_KEY }}
  # ── Build: Docker ───────────────────────────────────────────────────────────
  build-docker:
    name: Docker
    # Docker builds are too heavy to run in the queue and build-docker.yaml has no
    # skip input, so this stays skipped on merge_group; the required `Docker / *`
    # contexts are reported (green) by merge-queue-docker.yaml instead.
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' }}
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@3df1022f4b852f1b7acd064123ce819258a62fe3 # build-docker-v4.0.1
    needs: [changes, checks, tests, schema-validation, postgres-schema, build-binaries]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L --option fallback true .#docker-bloklid-x86_64-linux",
            "smoke_test_command": "nix develop -c just smoke-test"
          }
        ]
      cachix_cache_name: blokli
      build_file: bloklid/Cargo.toml
      docker_image_name: bloklid
      docker_image_format: skopeo
      concurrency_group_suffix: ${{ github.event.pull_request.number || github.ref_name }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  build-docker-with-anvil:
    name: Docker anvil
    # Not a required check; skip in the merge queue.
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' }}
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@3df1022f4b852f1b7acd064123ce819258a62fe3 # build-docker-v4.0.1
    needs: [changes, checks, tests, schema-validation, postgres-schema, build-binaries]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-bloklid-anvil-x86_64-linux",
            "smoke_test_command": "nix develop -c just smoke-test-curvy"
          }
        ]
      cachix_cache_name: blokli
      build_file: bloklid/Cargo.toml
      docker_image_name: bloklid-anvil
      docker_image_format: skopeo
      concurrency_group_suffix: anvil-${{ github.event.pull_request.number || github.ref_name }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in the branch ruleset once
  # the individual required checks are dropped. `if: always()` runs it even when
  # a dependency fails; alls-green then reds the gate on any non-success (a
  # failed job, or a skip that is not allowed).
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - validate-pr-title
      - label
      - changes
      - checks
      - tests
      - schema-validation
      - postgres-schema
      - build-binaries
      - build-docker
      - build-docker-with-anvil
    runs-on: depot-ubuntu-24.04-2
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # In the merge queue the PR-only jobs, the Docker builds and the
          # schema jobs skip, and checks/tests/build-binaries have every inner
          # job input-disabled, so their caller jobs report skipped. On a pull
          # request only the fork-gated schema jobs may skip, plus: `tests` on a
          # draft (tests.yaml skips coverage on drafts) or when the rust filter
          # is false; `build-binaries` when the rust filter is false. The Docker
          # builds never skip on a pull request. A failed job reds the gate in
          # every case.
          allowed-skips: ${{ github.event_name == 'merge_group' && 'validate-pr-title, label, checks, tests, schema-validation, postgres-schema, build-binaries, build-docker, build-docker-with-anvil' || format('label, schema-validation, postgres-schema{0}{1}', (github.event.pull_request.draft || needs.changes.outputs.rust != 'true') && ', tests' || '', needs.changes.outputs.rust != 'true' && ', build-binaries' || '') }}
