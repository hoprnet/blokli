[package]
description = "BLOKLI database implementation with SQL backend"
edition     = "2021"
homepage    = "https://hoprnet.org/"
license     = "GPL-3.0-only"
name        = "blokli-db"
repository  = "https://github.com/hoprnet/blokli"
version     = "0.17.0"

[lints]
workspace = true

[features]
default       = ["sqlite", "traits"]
runtime-tokio = ["sea-orm/runtime-tokio", "sea-orm/runtime-tokio-rustls"]
sqlite        = ["sea-orm/sqlx-sqlite", "sea-query/backend-sqlite"]
telemetry     = ["dep:lazy_static"]
traits        = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
lazy_static = { workspace = true, optional = true }
multiaddr = { workspace = true }
sea-orm = { workspace = true }
sea-query = { workspace = true, default-features = false, features = [
  "attr",
  "derive",
  "with-chrono",
] }
semver = { workspace = true }
smart-default = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
validator = { workspace = true }

blokli-db-entity = { workspace = true }
blokli-db-migration = { workspace = true }
hopr-types = { workspace = true, features = [
  "crypto",
  "internal",
  "primitive",
] }

[dev-dependencies]
anyhow      = { workspace = true }
criterion   = { workspace = true }
hex-literal = { workspace = true }
lazy_static = { workspace = true }
rand        = { workspace = true }
sea-orm     = { workspace = true }
tempfile    = { workspace = true }
tokio       = { workspace = true }

hopr-types = { workspace = true, features = [
  "crypto",
  "internal",
  "primitive",
  "random",
] }

[[bench]]
harness = false
name    = "db_hotpaths"

[package.metadata.cargo-machete]
ignored = ["blokli-db-migration"]
