---
# Default values for blokli
## @section Global Configuration ###
image:
  ## @param image.registry Container image registry
  ##
  registry: "europe-west3-docker.pkg.dev/hoprassociation/docker-images"
  ## @param image.repository Container image repository
  ##
  repository: "bloklid"
  ## @param image.pullPolicy Container image pull policy
  ##
  pullPolicy: Always
  ## @param image.tag Container image tag (defaults to chart appVersion if not specified)
  ##
  tag: ""
## @param imagePullSecrets Image pull secrets for private registries
##
imagePullSecrets: []
# - name: my-registry-secret

## @param nameOverride Override the chart name
##
nameOverride: ""
## @param fullnameOverride Override the full release name
##
fullnameOverride: ""
serviceAccount:
  ## @param serviceAccount.create Specifies whether a service account should be created
  ##
  create: true
  ## @param serviceAccount.annotations Annotations to add to the service account
  ##
  annotations: {}
  ## @param serviceAccount.name The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  ##
  name: ""
## @param deploymentAnnotations Annotations to add to the deployment
deploymentAnnotations: {}
## @param podAnnotations Annotations to add to the pod
podAnnotations: {}
podSecurityContext:
  ## @param podSecurityContext.runAsNonRoot Run container as non-root user
  ##
  runAsNonRoot: true
  ## @param podSecurityContext.runAsUser User ID to run the container
  ##
  runAsUser: 65532
  ## @param podSecurityContext.runAsGroup Group ID to run the container
  ##
  runAsGroup: 65532
  ## @param podSecurityContext.fsGroup File system group ID
  ##
  fsGroup: 65532
securityContext:
  ## @param securityContext.allowPrivilegeEscalation Prevent privilege escalation
  ##
  allowPrivilegeEscalation: false
  capabilities:
    ## @param securityContext.capabilities.drop Capabilities to drop
    ##
    drop:
      - ALL
  ## @param securityContext.readOnlyRootFilesystem Mount root filesystem as read-only
  ##
  readOnlyRootFilesystem: true
  ## @param securityContext.runAsNonRoot Run container as non-root user
  ##
  runAsNonRoot: true
  ## @param securityContext.runAsUser User ID to run the container
  ##
  runAsUser: 65532
service:
  ## @param service.type Service type
  ##
  type: ClusterIP
  ## @param service.port Service port for GraphQL API
  ##
  port: 8080
  ## @param service.annotations Service annotations
  ##
  annotations: {}
ingress:
  ## @param ingress.enabled Enable ingress for GraphQL API
  ##
  enabled: false
  ## @param ingress.className Ingress class name
  ##
  className: ""
  ## @param ingress.annotations Ingress annotations
  ##
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt-prod

  ## @param ingress.hostname Hostnames for the GraphQL API
  ##
  hostname: ""
  ## @param ingress.tls Enable TLS configuration for ingress. It will reference a secret named <hostname>-tls. Where hostname dots are replaced with dashes.
  ##
  tls: true
## @param resources Resource requests and limits
##
# Sizing guidance:
#   Small (dev/test):     requests: 250m/512Mi, limits: 1000m/2Gi
#   Medium (production):  requests: 500m/1Gi,   limits: 2000m/4Gi
#   Large (high traffic): requests: 1000m/2Gi,  limits: 4000m/8Gi
resources: {}
# Liveness probe configuration
livenessProbe:
  ## @param livenessProbe.enabled Enable liveness probe
  ##
  enabled: true
  ## @param livenessProbe.initialDelaySeconds Initial delay before liveness probe starts
  ##
  initialDelaySeconds: 30
  ## @param livenessProbe.periodSeconds Period between liveness probe checks
  ##
  periodSeconds: 10
  ## @param livenessProbe.timeoutSeconds Timeout for liveness probe
  ##
  timeoutSeconds: 5
  ## @param livenessProbe.successThreshold Success threshold for liveness probe
  ##
  successThreshold: 1
  ## @param livenessProbe.failureThreshold Failure threshold for liveness probe
  ##
  failureThreshold: 3
# Readiness probe configuration
readinessProbe:
  ## @param readinessProbe.enabled Enable readiness probe
  ##
  enabled: true
  ## @param readinessProbe.initialDelaySeconds Initial delay before readiness probe starts
  ##
  initialDelaySeconds: 10
  ## @param readinessProbe.periodSeconds Period between readiness probe checks
  ##
  periodSeconds: 5
  ## @param readinessProbe.timeoutSeconds Timeout for readiness probe
  ##
  timeoutSeconds: 3
  ## @param readinessProbe.successThreshold Success threshold for readiness probe
  ##
  successThreshold: 1
  ## @param readinessProbe.failureThreshold Failure threshold for readiness probe
  ##
  failureThreshold: 3
# Startup probe configuration
startupProbe:
  ## @param startupProbe.enabled Enable startup probe
  ##
  enabled: true
  ## @param startupProbe.initialDelaySeconds Initial delay before startup probe starts
  ##
  initialDelaySeconds: 0
  ## @param startupProbe.periodSeconds Period between startup probe checks
  ##
  periodSeconds: 10
  ## @param startupProbe.timeoutSeconds Timeout for startup probe
  ##
  timeoutSeconds: 3
  ## @param startupProbe.successThreshold Success threshold for startup probe
  ##
  successThreshold: 1
  ## @param startupProbe.failureThreshold Failure threshold for startup probe (allows up to 5 minutes for startup)
  ##
  failureThreshold: 30
## @param nodeSelector Node selector for pod assignment
##
nodeSelector: {}
## @param tolerations Tolerations for pod assignment
##
tolerations: []
## @param affinity Affinity rules for pod assignment
##
affinity: {}
# Monitoring configuration
monitoring:
  serviceMonitor:
    ## @param monitoring.serviceMonitor.enabled Enable ServiceMonitor creation
    ##
    enabled: false
    ## @param monitoring.serviceMonitor.namespace ServiceMonitor namespace (defaults to release namespace)
    ##
    namespace: ""
    ## @param monitoring.serviceMonitor.labels ServiceMonitor labels
    ##
    labels: {}
    ## @param monitoring.serviceMonitor.interval Scrape interval
    ##
    interval: 30s
    ## @param monitoring.serviceMonitor.scrapeTimeout Scrape timeout
    ##
    scrapeTimeout: 10s
    ## @param monitoring.serviceMonitor.path Metrics path exposed by the embedded API server
    ##
    path: /metrics
  prometheusRule:
    ## @param monitoring.prometheusRule.enabled Enable PrometheusRule (alerting rules) creation. Requires the Prometheus Operator CRDs
    ##
    enabled: false
    ## @param monitoring.prometheusRule.namespace PrometheusRule namespace (defaults to release namespace)
    ##
    namespace: ""
    ## @param monitoring.prometheusRule.labels Additional labels on the PrometheusRule resource (e.g. to match a Prometheus Operator ruleSelector)
    ##
    labels: {}
    # Alerting rule thresholds. Each rule can be disabled independently; runbooks are documented under /runbooks
    rules:
      indexerLagHigh:
        ## @param monitoring.prometheusRule.rules.indexerLagHigh.enabled Enable the blokli-indexer-lag-high alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.indexerLagHigh.thresholdBlocks Number of blocks the indexer may lag behind the chain head before firing
        ##
        thresholdBlocks: 15
        ## @param monitoring.prometheusRule.rules.indexerLagHigh.for How long the lag must stay above the threshold before firing
        ##
        for: 5m
      indexerStalled:
        ## @param monitoring.prometheusRule.rules.indexerStalled.enabled Enable the blokli-indexer-stalled alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.indexerStalled.windowMinutes Look-back window (minutes) used to detect indexer progress against chain head progress
        ##
        windowMinutes: 5
        ## @param monitoring.prometheusRule.rules.indexerStalled.for How long the stalled condition must persist before firing
        ##
        for: 2m
      unhealthy:
        ## @param monitoring.prometheusRule.rules.unhealthy.enabled Enable the blokli-unhealthy alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.unhealthy.for How long readiness must report unhealthy before firing
        ##
        for: 5m
      stateCorrupted:
        ## @param monitoring.prometheusRule.rules.stateCorrupted.enabled Enable the blokli-state-corrupted alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.stateCorrupted.for How long the corrupted status must persist before firing
        ##
        for: 1m
      transactionFailed:
        ## @param monitoring.prometheusRule.rules.transactionFailed.enabled Enable the blokli-transaction-failed alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.transactionFailed.windowMinutes Short look-back window (minutes) for the recent failure rate
        ##
        windowMinutes: 15
        ## @param monitoring.prometheusRule.rules.transactionFailed.minFailures Minimum absolute number of failures in windowMinutes before this counts as a spike at all, regardless of ratio
        ##
        minFailures: 3
        ## @param monitoring.prometheusRule.rules.transactionFailed.baselineWindowHours Longer look-back window (hours) establishing the "normal" recent failure rate to compare against
        ##
        baselineWindowHours: 6
        ## @param monitoring.prometheusRule.rules.transactionFailed.spikeMultiplier How many times higher than the baseline rate the recent rate must be to count as a spike
        ##
        spikeMultiplier: 3
        ## @param monitoring.prometheusRule.rules.transactionFailed.for How long the spike must persist across evaluations before firing
        ##
        for: 1m
      transactionValidationFailed:
        ## @param monitoring.prometheusRule.rules.transactionValidationFailed.enabled Enable the blokli-transaction-validation-failed alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.transactionValidationFailed.windowMinutes Look-back window (minutes) used to detect transactions rejected before submission (malformed/disallowed raw transactions)
        ##
        windowMinutes: 15
        ## @param monitoring.prometheusRule.rules.transactionValidationFailed.minFailures Minimum number of validation failures in windowMinutes before firing, so a handful of one-off bad requests (a stale client, a few scanner probes) doesn't page on its own
        ##
        minFailures: 5
        ## @param monitoring.prometheusRule.rules.transactionValidationFailed.for How long the failure must persist across evaluations before firing
        ##
        for: 5m
      rpcFailureRateHigh:
        ## @param monitoring.prometheusRule.rules.rpcFailureRateHigh.enabled Enable the blokli-rpc-failure-rate-high alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.rpcFailureRateHigh.thresholdRatio Fraction (0-1) of failed RPC calls over the evaluation window before firing
        ##
        thresholdRatio: 0.1
        ## @param monitoring.prometheusRule.rules.rpcFailureRateHigh.for How long the failure ratio must stay above the threshold before firing
        ##
        for: 10m
      rpcCallLatencyHigh:
        ## @param monitoring.prometheusRule.rules.rpcCallLatencyHigh.enabled Enable the blokli-rpc-call-latency-high alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.rpcCallLatencyHigh.thresholdSeconds p95 RPC call latency (seconds) before firing
        ##
        thresholdSeconds: 5
        ## @param monitoring.prometheusRule.rules.rpcCallLatencyHigh.for How long the p95 latency must stay above the threshold before firing
        ##
        for: 10m
      rpcRetriesHigh:
        ## @param monitoring.prometheusRule.rules.rpcRetriesHigh.enabled Enable the blokli-rpc-retries-high alert. Defaults to disabled: blokli_retries_per_rpc_call has no code path that ever records it yet (blocked on TODO(#7140) in chain/rpc/src/client.rs), so this alert cannot fire regardless of the threshold until that lands. See runbooks/blokli-rpc-retries-high.md
        ##
        enabled: false
        ## @param monitoring.prometheusRule.rules.rpcRetriesHigh.thresholdRetries p95 retries per RPC call before firing
        ##
        thresholdRetries: 3
        ## @param monitoring.prometheusRule.rules.rpcRetriesHigh.for How long the p95 retries must stay above the threshold before firing
        ##
        for: 10m
      graphqlErrorRateHigh:
        ## @param monitoring.prometheusRule.rules.graphqlErrorRateHigh.enabled Enable the blokli-graphql-error-rate-high alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.graphqlErrorRateHigh.thresholdRatio Fraction (0-1) of query/mutation requests resulting in errors over the evaluation window before firing. Does not apply to invalid_request or subscription, which have no meaningful request-count denominator (see thresholdInvalidRequestCount / thresholdSubscriptionErrorCount)
        ##
        thresholdRatio: 0.05
        ## @param monitoring.prometheusRule.rules.graphqlErrorRateHigh.thresholdInvalidRequestCount Number of malformed/unparseable GraphQL requests over a 5m window before firing
        ##
        thresholdInvalidRequestCount: 5
        ## @param monitoring.prometheusRule.rules.graphqlErrorRateHigh.thresholdSubscriptionErrorCount Number of errored messages pushed over GraphQL subscription connections over a 5m window before firing
        ##
        thresholdSubscriptionErrorCount: 5
        ## @param monitoring.prometheusRule.rules.graphqlErrorRateHigh.for How long any one of the three conditions above must stay breached before firing
        ##
        for: 10m
      graphqlLatencyHigh:
        ## @param monitoring.prometheusRule.rules.graphqlLatencyHigh.enabled Enable the blokli-graphql-latency-high alert
        ##
        enabled: true
        ## @param monitoring.prometheusRule.rules.graphqlLatencyHigh.thresholdSeconds p95 GraphQL request latency (seconds) before firing
        ##
        thresholdSeconds: 2
        ## @param monitoring.prometheusRule.rules.graphqlLatencyHigh.for How long the p95 latency must stay above the threshold before firing
        ##
        for: 10m
## @param extraEnv Additional environment variables
##
extraEnv: []
# - name: CUSTOM_VAR
#   value: "custom-value"

## @param extraVolumes Additional volumes
##
extraVolumes: []
# - name: custom-volume
#   emptyDir: {}

## @param extraVolumeMounts Additional volume mounts
##
extraVolumeMounts: []
# - name: custom-volume
#   mountPath: /custom-path

## @section Blokli Application Configuration ###

# Persistence configuration for data directory
persistence:
  ## @param persistence.enabled Enable persistence for data directory
  ##
  enabled: true
  ## @param persistence.storageClass Storage class for PVC
  ##
  # If undefined (the default) or set to null, no storageClassName spec is set,
  # choosing the default provisioner
  storageClass: ""
  ## @param persistence.accessModes Access mode for PVC
  ##
  accessModes:
    - ReadWriteOnce
  ## @param persistence.size Size of the PVC
  ##
  size: 10Gi
  ## @param persistence.annotations Annotations for the PVC
  ##
  annotations: {}
  ## @param persistence.selector Selector for existing PV (optional)
  ##
  selector: {}
# Database configuration
database:
  ## @param database.type Database type (e.g., postgresql, sqlite)
  ##
  type: ""
  ## @param database.host PostgreSQL host
  ##
  host: ""
  ## @param database.port PostgreSQL port
  ##
  port: 5432
  ## @param database.database PostgreSQL database name
  ##
  database: ""
  ## @param database.username PostgreSQL username
  ##
  username: ""
  ## @param database.password PostgreSQL password (ignored if existingSecret is set)
  ##
  password: ""
  ## @param database.index_path Sqlite database file path (used only if database.type is "sqlite")
  ##
  index_path: ""
  ## @param database.logs_path Sqlite logs database file path (used only if database.type is "sqlite")
  ##
  logs_path: ""
  ## @param database.existingSecret Name of existing secret containing database credentials
  ##
  ## Secret should contain key BLOKLI_DATABASE_URL with the full database URL in the format: postgresql://username:password@host:port/database
  existingSecret: ""
  ## @param database.maxConnections Maximum number of database connections
  ##
  maxConnections: 10
# Bloklid configuration
config:
  ## @param config.network HOPR network to index (anvil-localhost, jura-dev, jura-prod, piz-palu-dev, piz-palu-staging)
  ##
  network: "jura-prod"
  ## @param config.rpcUrl Blockchain RPC URL
  ##
  rpcUrl: ""
  ## @param config.maxRpcRequestsPerSec Maximum RPC requests per second (0 = unlimited)
  ##
  maxRpcRequestsPerSec: 0
  ## @param config.dataDirectory Data directory path (should match persistence mount path)
  ##
  dataDirectory: "/data"
  # Indexer settings
  indexer:
    ## @param config.indexer.fastSync Enable fast sync mode
    ##
    fastSync: true
    ## @param config.indexer.enableLogsSnapshot Enable logs snapshot feature
    ##
    enableLogsSnapshot: false
    ## @param config.indexer.enableSafeIndexing Enable Safe contract event indexing for discovered Safes
    ##
    enableSafeIndexing: false
    ## @param config.indexer.logsSnapshotUrl URL for logs snapshot download (required when enableLogsSnapshot is true)
    ##
    logsSnapshotUrl: ""
    # Subscription behavior configuration
    subscription:
      ## @param config.indexer.subscription.eventBusCapacity Capacity of the event bus buffer for channel events
      ##
      # Higher values prevent overflow but use more memory
      eventBusCapacity: 1000
      ## @param config.indexer.subscription.shutdownSignalCapacity Capacity of the shutdown signal buffer
      ##
      # Typically a small value is sufficient
      shutdownSignalCapacity: 10
      ## @param config.indexer.subscription.batchSize Batch size for Phase 1 historical channel queries
      ##
      # Higher values fetch more data per query but may increase latency
      batchSize: 100
  # API server configuration
  api:
    ## @param config.api.enabled Enable or disable the GraphQL API server
    ##
    enabled: true
    ## @param config.api.bindAddress Address and port for the API server to bind to
    ##
    bindAddress: "0.0.0.0:8080"
    ## @param config.api.playgroundEnabled Enable GraphQL Playground for development and testing. Recommended to set to false for production deployments
    ##
    playgroundEnabled: false
    ## @param config.api.gasMultiplier Multiplier for gas estimation to provide a safety margin (e.g., 1.2 for 20% extra)
    ##
    gasMultiplier: 1.2
    # Health check configuration
    health:
      ## @param config.api.health.maxIndexerLag Maximum indexer lag (blocks) before readiness fails
      ##
      maxIndexerLag: 10
      ## @param config.api.health.timeout Timeout for health check operations
      ##
      timeout: "5s"
      ## @param config.api.health.readinessCheckInterval Interval for periodic readiness checks
      ##
      readinessCheckInterval: "60s"
  # Logging configuration
  logging:
    ## @param config.logging.level Rust log level configuration. Examples: "info", "debug", "info,blokli_chain_indexer=debug"
    ##
    level: "info"
    ## @param config.logging.backtrace Rust backtrace configuration (e.g., "full", "short", "0")
    ##
    backtrace: full
    ## @param config.logging.format Log output format ("json" or empty for plain text)
    ##
    format: json
  # Telemetry configuration
  telemetry:
    ## @param config.telemetry.otlpEndpoint OTLP endpoint for telemetry data
    ##
    otlpEndpoint: ""
    ## @param config.telemetry.otlpSignals OTLP signals to export (e.g., "metrics", "traces")
    ##
    otlpSignals: "metrics"
    ## @param config.telemetry.metricExportInterval Interval for exporting metrics
    ##
    metricExportInterval: "15s"
