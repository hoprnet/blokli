---
image:
  tag: latest
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
  hostname: blokli.example.com
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi
persistence:
  storageClass: regional-rwo
  size: 10Gi
# Database configuration
database:
  type: "postgresql"
  host: postgres-18.postgres.svc
  database: bloklid
  username: bloklid
  password: "SomePassword"
  maxConnections: 20
config:
  network: "jura-prod"
  rpcUrl: "https://rpc.gnosischain.com"
  rpcWsUrl: "wss://rpc.gnosischain.com/wss"
  maxRpcRequestsPerSec: 0
  maxBlockRange: 2500
  # Indexer settings
  indexer:
    fastSync: true
    enableLogsSnapshot: false
    headTracking:
      headSubscription: true
      headPollInterval: "1s"
    confirmation:
      mode: "safe_or_depth"
      depth: 3
      maxSafeGap: 32
      verifyFinalized: true
    subscription:
      eventBusCapacity: 1000
      shutdownSignalCapacity: 10
  api:
    playgroundEnabled: true
    gasMultiplier: 1.2
  logging:
    level: "info"
  telemetry:
    otlpEndpoint: "http://otel-collector:4318"
    otlpSignals: "metrics"
    metricExportInterval: "15s"
